name: Crawl and deploy
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Every job that writes the data branch shares this group, so writers never race.
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crawl
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GITHUB_TOKEN allows 1,000 requests per hour; a repo needs about 8.
        run: npx tsx scripts/crawl.ts --data .data --max 100 --reserve 120 --concurrency 2
      - name: Save data
        if: github.event_name != 'push'
        run: scripts/push-data.sh .data "data: $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Build site
        run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Alert on failure
        if: failure() && github.event_name != 'pull_request'
        uses: ./.github/actions/alert
        with:
          title: "Crawl or site build is failing"
          details: "The hourly crawl or the site build failed. The live site keeps the last good version."
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Track request
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  # Same group as the crawl in site.yml: one writer of the data branch at a time.
  group: data
  cancel-in-progress: false
jobs:
  track:
    if: contains(github.event.issue.labels.*.name, 'track-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add and measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ANSWER_FILE: ${{ runner.temp }}/answer.json
        run: npx tsx scripts/track.ts --data .data
      - name: Save data
        run: scripts/push-data.sh .data "track: issue #${{ github.event.issue.number }}"
      - name: Answer and close (only after the data is saved)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSWER_FILE: ${{ runner.temp }}/answer.json
          ISSUE: ${{ github.event.issue.number }}
        run: |
          jq -r .body "$ANSWER_FILE" > "$RUNNER_TEMP/body.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "$(jq -r .reason "$ANSWER_FILE")"
          if [ "$(jq -r .changed "$ANSWER_FILE")" = "true" ]; then gh workflow run site.yml --repo "$GITHUB_REPOSITORY"; fi
      - name: Tell the requester on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Sorry, something went wrong while adding this repository. The maintainer has been notified and will retry."
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert
        with:
          title: "Track requests are failing"
          details: "A track request could not be processed."

name: Track request
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  track:
    if: contains(github.event.issue.labels.*.name, 'track-request')
    runs-on: ubuntu-latest
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add and measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/track.ts --data .data
      - name: Save data and redeploy
        working-directory: .data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "track: issue #${{ github.event.issue.number }}"
            git pull -q --rebase && git push -q
            gh workflow run site.yml --repo "${{ github.repository }}"
          fi
